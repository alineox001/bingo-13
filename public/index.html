<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bingo Latrell City</title>
<style>
:root{--gold:#ffe680;--img-board:url(/board.jpg?v=8);--img-card:url(/card.jpg?v=9);--gut:34px;--vw:calc(100vw - 2*var(--gut))}*{box-sizing:border-box}
html,body{height:100%}body{margin:0;height:100dvh;overflow:hidden;background:radial-gradient(circle at 30% 0,#3a1a78,#12072e 70%);color:#fff;font-family:system-ui,sans-serif;padding:4px var(--gut)}
[hidden]{display:none!important}
button{background:#ff4fa3;color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
input,select{font-size:16px}
.panel{background:linear-gradient(160deg,#3b2494,#1a0f4d);border:3px solid var(--gold);border-radius:16px;padding:8px 10px;box-shadow:0 0 18px #7b4dff55;min-height:0;position:relative;isolation:isolate}
h2{margin:0 0 6px;text-align:center;font:900 16px Impact,"Arial Black",sans-serif;letter-spacing:2px;color:var(--gold);animation:hg 4s ease-in-out infinite}
.fl{flex:1;display:flex;flex-direction:column;overflow:hidden}.sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#ffd23f99 #ffffff14;padding-right:3px}
.sc::-webkit-scrollbar{width:8px}.sc::-webkit-scrollbar-track{background:#ffffff14;border-radius:6px}.sc::-webkit-scrollbar-thumb{background:#ffd23f99;border-radius:6px}
.bar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-content:flex-start}.chips.one{flex-wrap:nowrap;overflow:hidden;justify-content:flex-start;margin-top:4px}
.nb{display:grid;place-items:center;flex:none;width:30px;aspect-ratio:1;border-radius:50%;font:900 14px Impact,"Arial Black",sans-serif;background:radial-gradient(circle at 35% 30%,#fff9,#ff4fa3 35%,#8a1fb0)}
.chips.one .nb{width:26px;font-size:12px}
.nb.new{background:radial-gradient(circle at 35% 30%,#fff,#ffd23f 40%,#c98400);color:#5a3400;box-shadow:0 0 12px #ffd23f}
.big{font:900 40px Impact,"Arial Black",sans-serif}
.in{width:100%;padding:7px 9px;border-radius:8px;border:2px solid #fff5;background:#120a38;color:#fff}
.pr{display:flex;align-items:center;gap:6px;margin-top:5px}.pr span{font-size:22px}
.rk{display:flex;align-items:center;gap:7px;padding:4px 7px;margin-top:4px;border-radius:10px;background:#ffffff14;font-size:13px;text-align:left}
.rk .nmx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk .nmx.wr{white-space:normal;overflow:visible;overflow-wrap:anywhere}
.rk .mid{flex:1;min-width:0}.rk .sub{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:2px}.rk .sub .pg{flex:1;width:auto}.rk .sub span{white-space:nowrap}
.tr{flex:none;position:relative;width:22px;height:22px;border-radius:50%;border:2px solid #fff9}
.tr::after{content:"";position:absolute;inset:-6px}
.tr.s{background:radial-gradient(circle at 35% 30%,#fff,#dfe6ee 35%,#9aa6b5 75%,#6b7787);box-shadow:0 0 6px #cfd8e6aa}
.tr.d{background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23f 40%,#c98400);border-color:#fff3b0;box-shadow:0 0 10px #ffd23f}
.tr.k{cursor:pointer;transition:transform .15s}.tr.k:hover{transform:scale(1.25)}
.tr.mini{display:inline-block;vertical-align:middle;width:12px;height:12px;border-width:1px}.tr.mini::after{display:none}
.cc{flex:none;font-size:11px;font-weight:800;background:#ffffff22;border-radius:8px;padding:2px 6px;white-space:nowrap}.more{opacity:.7;font-size:12px;text-align:center;margin-top:4px}
#cnt{text-align:center;font-size:13px;margin-bottom:4px}.rk small{display:block;opacity:.85;font-size:11px}
.rk.me{outline:2px solid var(--gold);background:#ffd23f22}
.rk.g1{background:linear-gradient(120deg,#ffd23f55,#ff9f1c22);border:2px solid #ffd23f}.rk.g2{background:linear-gradient(120deg,#d8e2f044,#9fb0c822);border:2px solid #d8e2f0}.rk.g3{background:linear-gradient(120deg,#e08a4a44,#a8542022);border:2px solid #e08a4a}.rk.g4{background:linear-gradient(120deg,#5be37d44,#2fa84f22);border:2px solid #5be37d}.rk.g5{background:linear-gradient(120deg,#4fd1ff44,#3b7bff22);border:2px solid #4fd1ff}
.rk.em{opacity:.55;border:2px dashed #fff5;background:none}.med{font-size:22px}
.pos{width:20px;text-align:center;font-weight:900;color:var(--gold)}
.pg{width:56px;height:7px;border-radius:5px;background:#ffffff22;overflow:hidden;flex:none}.pg i{display:block;height:100%;background:linear-gradient(90deg,#ff4fa3,#ffd23f)}
/* tablero y cartón sobre imagen */
.art{position:relative;container-type:inline-size;background-size:100% 100%;border-radius:12px;overflow:hidden;box-shadow:0 0 24px #7b4dff88}
.t{position:absolute;display:grid;place-items:center;line-height:1;padding-top:1%;border-radius:12%;font:900 var(--fs) "Arial Black",Impact,system-ui,sans-serif;color:#2b1a55;transition:.3s}
.t.m{color:#fff;text-shadow:0 0 .8cqw #7a2fd0,0 .3cqw 0 #3a1a78;background:radial-gradient(circle,#b57bff55,#7a2fd0aa)}
.t.last{box-shadow:0 0 2.4cqw #ffd23f,inset 0 0 1.6cqw #ffd23f;outline:.5cqw solid #ffd23f}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle at 35% 30%,#fff,#ffd23f 40%,#c98400);box-shadow:0 0 8px #ffd23f;transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.m .g{transform:translate(-50%,-50%) scale(1)}
/* anfitrión */
/* ===== anfitrión: 3 columnas simétricas (izq = der), tablero cuadrado al centro, sin scroll ===== */
#host{--w:clamp(230px,19vw,420px);--s:min(calc((100dvh - 8px)*1.3393),calc(var(--vw) - 2*var(--w) - 28px));height:calc(100dvh - 8px);display:grid;grid-template-columns:var(--w) var(--s) var(--w);gap:10px;justify-content:center;align-items:stretch}
#hl,#hr{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
#bw{width:var(--s);align-self:center}#board{width:100%;aspect-ratio:2400/1792;--fs:4.8cqw;background-image:var(--img-board)}
#fwr{flex:1;min-height:70px;display:grid;place-items:center;container-type:size}
#fw{position:relative;width:min(100cqw,100cqh);aspect-ratio:1;container-type:inline-size;border-radius:16px;overflow:hidden;border:3px solid var(--gold)}
#fw img{width:100%;height:100%;display:block;animation:bob 3s ease-in-out infinite}#fw.shake img{animation:jig .9s}
@keyframes bob{50%{transform:translateY(-1.5%) scale(1.015)}}
@keyframes jig{15%{transform:translate(-2%,1%) rotate(-3deg) scale(1.04)}30%{transform:translate(2%,-1%) rotate(3deg) scale(1.06)}45%{transform:translate(-2%,1%) rotate(-3deg) scale(1.04)}80%{transform:translateY(-3%) scale(1.07)}}
#ball{position:absolute;left:55%;top:55%;width:16%;display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font:900 7cqw Impact,"Arial Black",sans-serif;background:radial-gradient(circle at 35% 30%,#fff9,#ff4fa3 35%,#8a1fb0);opacity:0}
#ball.go{animation:pop 2.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(.6)}55%{transform:translate(-45%,-150%) scale(2.6)}85%{opacity:1;transform:translate(-45%,-150%) scale(2.6)}100%{opacity:0;transform:translate(-45%,-150%) scale(2.9)}}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-90px);z-index:70;background:#2fa84f;border:3px solid #fff;border-radius:14px;padding:10px 18px;font-weight:800;font-size:18px;box-shadow:0 6px 24px #000a;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}#toast.on{transform:translate(-50%,0)}
#bk,#cgb{display:none}
@media(min-width:900px) and (max-width:1150px),(min-width:900px) and (max-height:700px){#fwr{display:none}#pnCtl .big{font-size:32px}}
@media(min-width:900px) and (max-height:700px){#hr .panel,#hl .panel{padding:4px 8px}#hr .in,#hl .in{padding:3px 7px}#hr .lr,#hr .sr{margin-top:3px}#hr h2,#hl h2{font-size:13px;margin-bottom:2px}}
#hr{container-type:inline-size}
.lr{display:flex;gap:6px;margin-top:5px}.lr .in{flex:1;min-width:0}.sr{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:12px}.sr span{flex:1;min-width:0}
@container (max-width:330px){.lr.cr{flex-wrap:wrap}.lr.cr .in:first-child{flex:1 1 100%}.lr.cr button{flex:1}.lr.lk{flex-wrap:wrap}.lr.lk .in{flex:1 1 100%}.lr.lk button{flex:1}.sr{flex-wrap:wrap}.sr button{flex:1 1 100%}}
/* participante */
body.p{height:100dvh;overflow:hidden}
#play{height:calc(100dvh - 16px);margin:0 auto;display:flex;flex-direction:column;gap:6px;text-align:center}
#hd{display:flex;align-items:center;justify-content:center;gap:8px}#hd img{width:34px;height:34px;border-radius:50%}#hd h2{margin:0;font-size:15px;letter-spacing:1px;white-space:nowrap}
#nm{width:100%;font:700 20px system-ui;padding:11px;border-radius:12px;border:3px solid var(--gold);background:#120a38;color:#fff;margin:8px 0;text-align:center}
#join{max-width:420px;width:100%;margin:auto}
#game{flex:1;min-height:0;display:flex;flex-direction:column}
/* 3 columnas simétricas: izquierda (estado + ranking) · cartón · derecha (premios + historial) */
#main{--w:clamp(230px,22vw,430px);--s:min(calc(100dvh - 58px),calc(var(--vw) - 2*var(--w) - 36px));flex:1;min-height:0;display:grid;grid-template-columns:var(--w) var(--s) var(--w);grid-template-rows:auto minmax(0,1fr);gap:10px;justify-content:center}
#info{display:contents}
#cw{grid-column:2;grid-row:1/3;align-self:center;width:var(--s);aspect-ratio:1;--fs:8cqw;background-image:var(--img-card)}
#pnSt{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:center}#pnNum2{grid-column:1;grid-row:2;overflow:hidden}#pnTop2{grid-column:3;grid-row:1/3}
#info .panel{min-width:0;min-height:0}
#sp2{display:flex;align-items:center;gap:10px;justify-content:center;text-align:left}
#st{position:fixed;bottom:2px;left:50%;transform:translateX(-50%);font-size:10px;background:#000a;padding:1px 8px;border-radius:99px;z-index:60;white-space:nowrap}
.ov{position:fixed;inset:0;z-index:50;background:#0a041ee6;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.ov .panel{width:min(520px,100%);max-height:100%;overflow:auto;animation:wp .5s cubic-bezier(.3,1.8,.5,1)}@keyframes wp{from{transform:scale(.5);opacity:0}}
#cf{z-index:75}#cf .panel{width:min(640px,100%);padding:22px 18px}#cf h2{font-size:30px;margin:6px 0}#cf .bar{gap:14px;margin-top:16px}#cf .bar button{font-size:20px;padding:14px 24px}

/* ===== decoración ===== */
@keyframes hg{50%{text-shadow:0 0 12px #ffd23f}}@keyframes lp{50%{transform:scale(1.07)}}@keyframes tp{from{transform:scale(.7)}}
@keyframes tw{from{opacity:.15}to{opacity:.75}}@keyframes tw2{from{opacity:.9}to{opacity:.25}}
@keyframes bob2{50%{transform:translateY(-4px)}}@keyframes gl{50%{box-shadow:0 0 30px #ffd23f}}@keyframes bn{to{transform:translateY(-6px) scale(1.06)}}@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.15)}}
#bg,#fx{position:fixed;left:0;top:0;pointer-events:none}#bg{z-index:0}#fx{z-index:90}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;animation:drift 26s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle,#7b4dff88,transparent 65%)}
.o2{width:44vmax;height:44vmax;right:-14vmax;bottom:-14vmax;background:radial-gradient(circle,#ff4fa355,transparent 65%);animation-duration:32s}
.o3{width:30vmax;height:30vmax;right:8vmax;top:-8vmax;background:radial-gradient(circle,#ffd23f33,transparent 65%);animation-duration:38s}
#host,#play{position:relative;z-index:1}
#lights{position:fixed;top:0;left:0;right:0;height:10px;z-index:5;pointer-events:none}
#lights::before,#lights::after{content:'';position:absolute;inset:0;filter:drop-shadow(0 0 3px #fff8)}
#lights::before{background:radial-gradient(circle at 50% 4px,#ff4f4f 0 3px,transparent 4px) 0 0/56px 10px repeat-x,radial-gradient(circle at 50% 4px,#ffd23f 0 3px,transparent 4px) 28px 0/56px 10px repeat-x;animation:tw2 1.6s ease-in-out infinite alternate}
#lights::after{background:radial-gradient(circle at 50% 4px,#4fd1ff 0 3px,transparent 4px) 14px 0/56px 10px repeat-x,radial-gradient(circle at 50% 4px,#5be37d 0 3px,transparent 4px) 42px 0/56px 10px repeat-x;animation:tw 1.6s ease-in-out infinite alternate}
.fl::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle,#fff 0 1px,transparent 2px) 12% 18%/70px 90px,radial-gradient(circle,#ffe680 0 1.5px,transparent 2.5px) 60% 70%/110px 80px;animation:tw 3.5s ease-in-out infinite alternate}
.fl.wt-off::after{content:'';position:absolute;right:6px;bottom:6px;width:min(50%,170px);aspect-ratio:244/272;z-index:-1;pointer-events:none;background:var(--img-board) 95.4% .8%/558% auto;border-radius:14px;opacity:.22;-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent)}
.fl.wc::after{content:'💎';position:absolute;right:10px;bottom:2px;font-size:64px;line-height:1;opacity:.13;transform:rotate(8deg);z-index:-1;pointer-events:none}
.emp{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px;font-size:13px;opacity:.85}
.emp img,.hero{border-radius:50%;border:2px solid var(--gold);object-fit:cover;animation:bob2 2.6s ease-in-out infinite;box-shadow:0 0 14px #ffd23f88}.emp img{width:40px;height:40px;flex:none}
.hero{width:120px;height:120px;display:block;margin:0 auto 8px}
#fw{animation:gl 3s ease-in-out infinite}
.t.m{animation:tp .5s cubic-bezier(.3,1.8,.5,1)}.t.last{animation:lp 1.4s ease-in-out infinite}.nb.new{animation:lp 1.4s ease-in-out infinite}
#wt{animation:bn 1s ease-in-out infinite alternate}
#hr,#hl{overflow:hidden}.wtl{font-weight:900;color:var(--gold);margin:8px 0 2px;text-align:left}.wtl.t0{color:#e5e4e2}#hr>.panel:not(.fl),#hl>.panel:not(.fl){flex:none}.fl{min-height:40px}
@media(max-height:800px){#hl .in{padding:4px 7px}#hr .panel,#hl .panel{padding:5px 8px}#hr h2{font-size:13px;margin-bottom:3px}#hr .rk{margin-top:2px;padding:2px 6px}#hr .big{font-size:30px}#hr button{padding:5px 8px;font-size:13px}}
#hd button{white-space:nowrap}@media(max-width:480px){#hd{gap:5px}#hd h2{font-size:12px;letter-spacing:.5px}#hd button{font-size:12px}}
@media(prefers-reduced-motion:reduce){#trk{transition:none!important}.nav{animation:none!important}h2,.orb,.fl::before,#lights::before,#lights::after,.emp img,.hero,#fw,.t.m,.t.last,.nb.new,#wt{animation:none!important}}

/* ===== modo compacto (celular / pantalla baja): todo cabe sin scroll; solo scrollea la lista de participantes ===== */
@media(max-width:899px),(max-height:559px){
 :root{--gut:22px}
 /* anfitrión */
 #host{--s:max(180px,min(calc(var(--vw) - 4px),calc((100dvh - 300px)*1.3393)));grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);justify-content:stretch;gap:6px}
 #hl,#hr{display:contents}
 #bw{order:1;justify-self:center}#pnCtl{order:2}#pnTop{order:3;min-height:0}
 #fwr,#pnLnk,#pnNum{display:none}
 #cgb{display:inline-block;background:#7b4dff;padding:8px 11px}
 #pnCtl{padding:5px 8px}
 #pnCtl .big{font-size:30px}#pnCtl .bar{margin-top:4px}#pnCtl button{padding:6px 9px;font-size:13px}
 body.cfg #bw,body.cfg #pnCtl,body.cfg #pnTop{display:none}
 body.cfg #bk{display:block;order:0}
 body.cfg #pnLnk{display:block;order:2}body.cfg #pnNum{display:block;order:3}
 /* participante */
 #main{--s:max(180px,min(calc(var(--vw) - 8px),calc(100dvh - 330px)));grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);justify-content:stretch;gap:6px}
 #cw{grid-column:1;grid-row:1;justify-self:center}
 #pnSt{grid-column:1;grid-row:2}#pnTop2{grid-column:1;grid-row:3}#pnNum2{display:none}
 #info .panel{padding:5px 8px}#info .rk{margin-top:2px;padding:2px 6px}#info .big{font-size:30px}
 #main h2{font-size:13px;margin-bottom:3px}
 .fl{min-height:0}#st{bottom:-1px;font-size:9px;line-height:11px;padding:0 7px;opacity:.75}
 .nav{width:calc(var(--gut) - 3px);height:64px;border-radius:10px;font-size:22px}.nav i{font-size:11px}
}
@media(max-height:700px) and (max-aspect-ratio:1/1){#pnTop h2,#pnTop2 h2{display:none}}
@media (max-width:899px) and (min-aspect-ratio:1/1),(max-height:559px) and (min-aspect-ratio:1/1){
 #host{--s:min(calc((100dvh - 8px)*1.3393),calc(var(--vw)*.62));grid-template-columns:var(--s) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:6px 8px;align-content:start}
 #bw{grid-column:1;grid-row:1/3;order:0;justify-self:start}
 #pnCtl,#pnTop{grid-column:2}#pnCtl{grid-row:1}#pnTop{grid-row:2}
 body.cfg #host{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 body.cfg #bk{grid-column:1/3;grid-row:1}
 body.cfg #pnLnk{grid-column:1;grid-row:2}body.cfg #pnNum{grid-column:2;grid-row:2}
 body.cfg #pnNum #hn{display:none}
 #main{--s:calc(100dvh - 58px);grid-template-columns:var(--s) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 #cw{grid-column:1;grid-row:1/3;justify-self:start}
 #pnSt{grid-column:2;grid-row:1}#pnTop2{grid-column:2;grid-row:2}
}
@media(max-width:899px) and (max-height:760px) and (max-aspect-ratio:1/1){#main h2{display:none}}

/* ===== vistas deslizables (juego ⇄ ganadores) ===== */
#vp{position:relative;height:calc(100dvh - 8px);overflow:hidden}
#trk{display:flex;width:200%;height:100%;transition:transform .6s cubic-bezier(.65,0,.25,1);will-change:transform}
.view{width:50%;flex:none;height:100%;position:relative;min-width:0}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:40;width:calc(var(--gut) - 4px);height:84px;padding:0;border-radius:14px;font-size:30px;line-height:1;color:var(--gold);background:linear-gradient(160deg,#7b4dff,#3b2494);border:2px solid var(--gold);box-shadow:0 0 14px #7b4dff88;transition:opacity .35s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav i{font-style:normal;font-size:14px;line-height:1}
#navL{left:2px}#navR{right:2px;animation:nudge 2.2s ease-in-out infinite}
.nav.off{opacity:0;pointer-events:none}
@keyframes nudge{50%{box-shadow:0 0 22px #ffd23f}}
/* pantalla de ganadores */
#wvi{height:calc(100dvh - 8px);display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
#wbar{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;min-height:34px}#wbar h2{margin:0;font-size:22px}
#wcols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcol{display:flex;flex-direction:column;min-height:0;padding:10px 14px}
.wh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.wh h2{margin:0;flex:1;font-size:clamp(20px,2.6vw,38px)}
.wpl{font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}.wsel{width:auto;padding:3px 4px}
.wls{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px}
.wrow{flex:1;min-height:0;display:flex;align-items:center;gap:10px;padding:4px 12px;border-radius:14px;overflow:hidden;transition:.4s;text-align:left}
.wrow .med{font-size:clamp(22px,3vw,44px);flex:none}
.wm{flex:1;min-width:0}.wn{font:800 clamp(14px,1.9vw,28px) system-ui,sans-serif;overflow-wrap:anywhere;line-height:1.15}
.wd{display:block;font-size:clamp(10px,1vw,14px);opacity:.85}.wd:empty{display:none}
.wz{font-size:clamp(11px,1.2vw,17px);margin-top:2px}.wz:empty{display:none}
